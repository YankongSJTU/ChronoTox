<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoTheraAtlas - Local Server</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; color: #2c3e50; }

        /* Header */
        .header { background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%); color: white; padding: 30px 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .header h1 { font-size: 2em; margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 1.05em; }
        .header .subtitle { font-size: 0.9em; opacity: 0.7; margin-top: 5px; }

        /* Navigation tabs */
        .nav-tabs { background: white; padding: 0 40px; border-bottom: 2px solid #e0e0e0; display: flex; gap: 0; }
        .nav-tab { padding: 15px 25px; cursor: pointer; font-weight: 500; color: #666; border-bottom: 3px solid transparent; transition: all 0.2s; }
        .nav-tab:hover { color: #1a237e; background: #f5f5ff; }
        .nav-tab.active { color: #1a237e; border-bottom-color: #1a237e; }

        /* Main content */
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 40px; }

        /* Tab panels */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* Search section */
        .search-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 30px; }
        .search-row { display: flex; gap: 15px; align-items: center; }
        .search-input { flex: 1; padding: 12px 20px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; transition: border-color 0.2s; }
        .search-input:focus { outline: none; border-color: #3949ab; }
        .btn { padding: 12px 28px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .btn-primary { background: #3949ab; color: white; }
        .btn-primary:hover { background: #283593; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(57,73,171,0.3); }

        /* Drug info card */
        .drug-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 25px; }
        .drug-card h3 { color: #1a237e; margin-bottom: 15px; font-size: 1.3em; }
        .drug-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .meta-item { padding: 12px; background: #f8f9ff; border-radius: 8px; }
        .meta-item .label { font-size: 0.85em; color: #666; margin-bottom: 4px; }
        .meta-item .value { font-weight: 600; color: #1a237e; }

        /* Target cards */
        .target-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 25px; margin-top: 20px; }
        .target-card { background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; }
        .target-header { background: linear-gradient(135deg, #3949ab, #5c6bc0); color: white; padding: 15px 20px; }
        .target-header h4 { font-size: 1.1em; }
        .target-header .stats { font-size: 0.85em; opacity: 0.9; margin-top: 4px; }
        .target-body { padding: 20px; }

        /* Plot containers */
        .plot-container { background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 25px; }

        /* Table */
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9em; }
        .data-table th { background: #3949ab; color: white; padding: 10px 12px; text-align: left; }
        .data-table td { padding: 8px 12px; border-bottom: 1px solid #eee; }
        .data-table tr:hover { background: #f8f9ff; }

        /* Atlas overview */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center; }
        .stat-card .number { font-size: 2.5em; font-weight: 700; color: #3949ab; }
        .stat-card .desc { color: #666; margin-top: 5px; }

        /* Loading */
        .loading { text-align: center; padding: 40px; color: #999; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3949ab; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Legend */
        .system-legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.85em; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }

        /* Gene search in explorer */
        .gene-search { display: flex; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="header">
    <h1>ChronoTheraAtlas</h1>
    <p>A Circadian Rhythm Atlas-Based Intelligent Platform for Chronotoxicity Assessment</p>
    <div class="subtitle">Local Server Edition | 63-Tissue Atlas | DrugBank Integration</div>
</div>

<div class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('drug')">Drug Analysis</div>
    <div class="nav-tab" onclick="switchTab('gene')">Gene Explorer</div>
    <div class="nav-tab" onclick="switchTab('atlas')">Atlas Overview</div>
</div>

<div class="container">

    <!-- Drug Analysis Tab -->
    <div id="tab-drug" class="tab-panel active">
        <div class="search-box">
            <h3 style="margin-bottom:15px; color:#1a237e;">Search Drug</h3>
            <div class="search-row">
                <input type="text" id="drugInput" class="search-input" placeholder="Enter drug name (e.g., Midodrine) or DrugBank ID..." onkeydown="if(event.key==='Enter')searchDrug()">
                <button class="btn btn-primary" onclick="searchDrug()">Search</button>
            </div>
        </div>
        <div id="drugResults"></div>
    </div>

    <!-- Gene Explorer Tab -->
    <div id="tab-gene" class="tab-panel">
        <div class="search-box">
            <h3 style="margin-bottom:15px; color:#1a237e;">Gene Rhythmic Explorer</h3>
            <div class="gene-search">
                <input type="text" id="geneInput" class="search-input" placeholder="Enter gene symbol (e.g., ADRA1B, PER1, CLOCK)..." onkeydown="if(event.key==='Enter')analyzeGene()">
                <button class="btn btn-primary" onclick="analyzeGene()">Analyze</button>
            </div>
        </div>
        <div id="geneResults"></div>
    </div>

    <!-- Atlas Overview Tab -->
    <div id="tab-atlas" class="tab-panel">
        <div class="stats-grid" id="atlasStats"></div>
        <div class="plot-container">
            <div id="atlasPlot"></div>
        </div>
    </div>

</div>

<script>
const SYSTEM_COLORS = {
    'Cardiovascular': '#e74c3c', 'Nervous': '#3498db', 'Digestive': '#2ecc71',
    'Endocrine': '#f39c12', 'Musculoskeletal': '#9b59b6', 'Immune': '#1abc9c',
    'Respiratory': '#e67e22', 'Renal': '#16a085', 'Adipose': '#f1c40f',
    'Reproductive': '#d35400', 'Integumentary': '#c0392b', 'Sensory': '#2980b9',
    'Excretory': '#7f8c8d'
};

function switchTab(tab) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    event.target.classList.add('active');
    if (tab === 'atlas') loadAtlas();
}

// ---- Drug Search ----
async function searchDrug() {
    const query = document.getElementById('drugInput').value.trim();
    if (!query) return;

    const container = document.getElementById('drugResults');
    container.innerHTML = '<div class="loading"><div class="spinner"></div>Analyzing drug targets...</div>';

    try {
        const resp = await fetch('/search', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({query: query})
        });
        const drugs = await resp.json();

        if (drugs.length === 0) {
            container.innerHTML = '<div class="drug-card"><p>No drug found. Try: Midodrine</p></div>';
            return;
        }

        let html = '';
        for (const drug of drugs) {
            html += `<div class="drug-card">
                <h3>${drug.name} <span style="font-size:0.7em;color:#666">${drug.drugbank_id || ''}</span></h3>
                <div class="drug-meta">
                    <div class="meta-item"><div class="label">Indication</div><div class="value">${drug.indication || '-'}</div></div>
                    <div class="meta-item"><div class="label">CAS Number</div><div class="value">${drug.cas || '-'}</div></div>
                    <div class="meta-item"><div class="label">Targets</div><div class="value">${(drug.targets||[]).join(', ')}</div></div>
                    <div class="meta-item"><div class="label">Description</div><div class="value">${drug.description || '-'}</div></div>
                </div>
            </div>`;

            // Analyze each target
            for (const target of (drug.targets || [])) {
                html += `<div class="target-grid"><div class="target-card" style="width:100%">
                    <div class="target-header">
                        <h4>${target} Rhythmic Analysis</h4>
                        <div class="stats" id="target-stats-${target}">Loading...</div>
                    </div>
                    <div class="target-body">
                        <div id="target-fit-${target}" style="margin-bottom:20px;"></div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                            <div id="target-polar-${target}"></div>
                            <div id="target-heatmap-${target}"></div>
                        </div>
                        <div id="target-r2-${target}" style="margin-top:20px;"></div>
                        <div id="target-table-${target}" style="margin-top:20px;"></div>
                    </div>
                </div></div>`;
            }
        }
        container.innerHTML = html;

        // Load plots for each target
        for (const drug of drugs) {
            for (const target of (drug.targets || [])) {
                loadTargetPlots(target);
            }
        }
    } catch(e) {
        container.innerHTML = `<div class="drug-card"><p style="color:red">Error: ${e.message}</p></div>`;
    }
}

async function loadTargetPlots(gene) {
    try {
        const resp = await fetch(`/analyze_gene/${gene}`);
        const data = await resp.json();
        document.getElementById(`target-stats-${gene}`).textContent =
            `${data.significant_tissues} of ${data.total_tissues} tissues show significant rhythmicity (p<0.05)`;

        // Load plots in parallel
        const [fitData, polarData, heatmapData, r2Data] = await Promise.all([
            fetch(`/plot/fit_curves/${gene}`).then(r => r.json()),
            fetch(`/plot/polar/${gene}`).then(r => r.json()),
            fetch(`/plot/heatmap/${gene}`).then(r => r.json()),
            fetch(`/plot/r_squared/${gene}`).then(r => r.json()),
        ]);

        Plotly.react(`target-fit-${gene}`, fitData.data, fitData.layout, {responsive: true});
        Plotly.react(`target-polar-${gene}`, polarData.data, polarData.layout, {responsive: true});
        Plotly.react(`target-heatmap-${gene}`, heatmapData.data, heatmapData.layout, {responsive: true});
        Plotly.react(`target-r2-${gene}`, r2Data.data, r2Data.layout, {responsive: true});

        // Table
        let tableHtml = '<table class="data-table"><thead><tr><th>Tissue</th><th>System</th><th>R²</th><th>P-value</th><th>Amplitude</th><th>Acrophase</th><th>Peak Time</th></tr></thead><tbody>';
        for (const r of data.results) {
            tableHtml += `<tr>
                <td><strong>${r.tissue}</strong> (${r.tissue_name})</td>
                <td><span class="legend-dot" style="background:${SYSTEM_COLORS[r.organ_system]||'#999'};display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;"></span>${r.organ_system}</td>
                <td>${r.r_squared.toFixed(4)}</td>
                <td>${r.p_value.toExponential(2)}</td>
                <td>${r.amplitude.toFixed(4)}</td>
                <td>ZT${r.acrophase_zt.toFixed(1)}</td>
                <td><strong>${r.acrophase_time}</strong></td>
            </tr>`;
        }
        tableHtml += '</tbody></table>';
        document.getElementById(`target-table-${gene}`).innerHTML = tableHtml;

    } catch(e) {
        console.error(`Error loading plots for ${gene}:`, e);
    }
}

// ---- Gene Explorer ----
async function analyzeGene() {
    const gene = document.getElementById('geneInput').value.trim().toUpperCase();
    if (!gene) return;

    const container = document.getElementById('geneResults');
    container.innerHTML = '<div class="loading"><div class="spinner"></div>Analyzing gene rhythmicity...</div>';

    try {
        const resp = await fetch(`/analyze_gene/${gene}`);
        const data = await resp.json();

        let html = `<div class="drug-card">
            <h3>${gene} Rhythmic Analysis</h3>
            <p>${data.significant_tissues} of ${data.total_tissues} tissues show significant rhythmicity (p<0.05)</p>
        </div>`;

        html += '<div class="plot-container"><div id="gene-fit" style="width:100%;"></div></div>';
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:25px;">';
        html += '<div class="plot-container"><div id="gene-polar"></div></div>';
        html += '<div class="plot-container"><div id="gene-heatmap"></div></div>';
        html += '</div>';
        html += '<div class="plot-container"><div id="gene-r2"></div></div>';

        // Table
        html += '<div class="drug-card"><table class="data-table"><thead><tr><th>Tissue</th><th>Name</th><th>System</th><th>R²</th><th>P-value</th><th>Amplitude</th><th>Acrophase (ZT)</th><th>Peak Time</th></tr></thead><tbody>';
        for (const r of data.results) {
            html += `<tr>
                <td><strong>${r.tissue}</strong></td><td>${r.tissue_name}</td>
                <td>${r.organ_system}</td>
                <td>${r.r_squared.toFixed(4)}</td>
                <td>${r.p_value.toExponential(2)}</td>
                <td>${r.amplitude.toFixed(4)}</td>
                <td>ZT${r.acrophase_zt.toFixed(1)}</td>
                <td><strong>${r.acrophase_time}</strong></td>
            </tr>`;
        }
        html += '</tbody></table></div>';
        container.innerHTML = html;

        // Load plots
        const [fitData, polarData, heatmapData, r2Data] = await Promise.all([
            fetch(`/plot/fit_curves/${gene}`).then(r => r.json()),
            fetch(`/plot/polar/${gene}`).then(r => r.json()),
            fetch(`/plot/heatmap/${gene}`).then(r => r.json()),
            fetch(`/plot/r_squared/${gene}`).then(r => r.json()),
        ]);
        Plotly.react('gene-fit', fitData.data, fitData.layout, {responsive: true});
        Plotly.react('gene-polar', polarData.data, polarData.layout, {responsive: true});
        Plotly.react('gene-heatmap', heatmapData.data, heatmapData.layout, {responsive: true});
        Plotly.react('gene-r2', r2Data.data, r2Data.layout, {responsive: true});

    } catch(e) {
        container.innerHTML = `<div class="drug-card"><p style="color:red">Error: ${e.message}</p></div>`;
    }
}

// ---- Atlas Overview ----
async function loadAtlas() {
    try {
        const resp = await fetch('/atlas_overview');
        const data = await resp.json();
        document.getElementById('atlasStats').innerHTML = `
            <div class="stat-card"><div class="number">${data.tissue_count}</div><div class="desc">Tissues Analyzed</div></div>
            <div class="stat-card"><div class="number">${data.total_rhythmic_genes.toLocaleString()}</div><div class="desc">Total Rhythmic Genes</div></div>
            <div class="stat-card"><div class="number">${data.avg_genes_per_tissue}</div><div class="desc">Avg Genes/Tissue</div></div>
        `;
        const plotResp = await fetch('/plot/atlas_overview');
        const plotData = await plotResp.json();
        Plotly.react('atlasPlot', plotData.data, plotData.layout, {responsive: true});
    } catch(e) {
        console.error('Error loading atlas:', e);
    }
}

// Auto-load atlas on page load
window.addEventListener('load', () => loadAtlas());
</script>

</body>
</html>
